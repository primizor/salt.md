name: Docker

# Build the container image and push it to GHCR.
# Fires on release tags (v*) and can be run manually for an existing version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (without leading v), e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ver="${{ inputs.version }}"
            echo "ver=${ver#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          repo_lower=$(echo "${GITHUB_REPOSITORY:-saltmd/salt.md}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lower}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.ver }}
            ${{ steps.v.outputs.image }}:latest
